name: 장중 수급 추정 알림

on:
  schedule:
    # GitHub cron은 UTC 기준 (한국시간 = UTC + 9), 갱신 후 약 10분 뒤 실행
    - cron: "40 0 * * 1-5"    # 09:40 KST (외국인 1차)
    - cron: "10 1 * * 1-5"    # 10:10 KST (기관 1차)
    - cron: "31 2 * * 1-5"    # 11:31 KST (11:20 집계)
    - cron: "31 4 * * 1-5"    # 13:31 KST (13:20 집계)
    - cron: "40 5 * * 1-5"    # 14:40 KST (14:30 집계)
  workflow_dispatch:          # Actions 탭에서 수동 실행(테스트용)

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Run
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCKS: "005930:삼성전자,000660:SK하이닉스"
        run: python kis_intraday_bot.py
